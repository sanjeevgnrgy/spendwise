# Every push and pull request: the checks of the definition of done (AGENTS.md section 7) that need no database and
# no model, through the same script developers run (backend/scripts/check.py). No secrets: nothing here calls Gemini
# or a sign-in provider.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same .venv a developer has: Pyright's settings (pyproject.toml) look for the packages there.
      - name: Install the Python tools and packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install the web app's packages
        working-directory: web
        run: npm ci

      - name: Run every check
        run: .venv/bin/python backend/scripts/check.py
