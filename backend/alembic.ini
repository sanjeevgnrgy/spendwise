# Alembic: database migrations for SpendWise. Run from the project folder:
#   .\.venv\Scripts\python.exe -m alembic -c backend\alembic.ini upgrade head
# (.\run.ps1 does this before starting the server.) The database URL is NOT here: env.py takes it
# from the app's settings (DATABASE_URL), so there's one place to change it.

[alembic]
script_location = %(here)s/migrations
# Lets env.py import the app ("app.bootstrap"), which lives in backend/.
prepend_sys_path = %(here)s
# Files named after their revision, e.g. 0002_neutral_conversations.py
file_template = %%(rev)s_%%(slug)s
path_separator = os

# Logging for the command line only (env.py leaves the app's own logging alone).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
